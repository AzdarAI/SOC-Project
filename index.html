<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Secret of Crystal — Enter the Gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --void:    #04050d;
      --deep:    #07091a;
      --card:    #0e1228;
      --border:  #1c2150;
      --crystal: #a78bfa;
      --crystal2:#7c3aed;
      --gold:    #f5c842;
      --gold2:   #d4a017;
      --danger:  #f43f5e;
      --text:    #e2e0f0;
      --muted:   #6b6d94;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      min-height: 100vh;
      background: var(--void);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    /* ── Custom Cursor ── */
    #cur-dot {
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      box-shadow: 0 0 10px var(--gold), 0 0 20px var(--gold2);
    }
    #cur-ring {
      width: 28px; height: 28px;
      border: 1px solid var(--crystal);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      opacity: .45;
    }

    /* ── Starfield ── */
    #starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* ── Background glow ── */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 55% 55% at 50% 50%, rgba(124,58,237,.18) 0%, transparent 65%),
        radial-gradient(ellipse 30% 40% at 20% 80%, rgba(245,200,66,.06) 0%, transparent 60%),
        radial-gradient(ellipse 30% 40% at 80% 20%, rgba(167,139,250,.07) 0%, transparent 60%);
    }

    /* Grid mesh */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(28,33,80,.25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28,33,80,.25) 1px, transparent 1px);
      background-size: 55px 55px;
      animation: meshPulse 8s ease-in-out infinite;
    }
    @keyframes meshPulse { 0%,100%{opacity:.2} 50%{opacity:.45} }

    /* ── LOGIN CARD ── */
    .gate-wrap {
      position: relative; z-index: 2;
      width: 100%; max-width: 420px;
      padding: 24px;
      opacity: 0;
      animation: rise .9s .2s ease forwards;
    }

    .gate-card {
      background: rgba(14,18,40,.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 44px 40px 36px;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(167,139,250,.06),
        0 30px 60px rgba(0,0,0,.6),
        0 0 80px rgba(124,58,237,.08) inset;
      position: relative;
      overflow: hidden;
    }

    /* Top glow strip */
    .gate-card::before {
      content: '';
      position: absolute; top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--crystal), var(--gold), var(--crystal), transparent);
      animation: stripPulse 3s ease-in-out infinite;
    }
    @keyframes stripPulse { 0%,100%{opacity:.4} 50%{opacity:1} }

    /* ── CRYSTAL ICON ── */
    .crystal-wrap {
      display: flex; justify-content: center;
      margin-bottom: 28px;
      position: relative;
    }
    .crystal-outer {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 1px solid rgba(167,139,250,.2);
      display: flex; align-items: center; justify-content: center;
      animation: orbit 8s linear infinite;
      position: relative;
    }
    @keyframes orbit { to { transform: rotate(360deg); } }
    /* Orbit dot */
    .crystal-outer::after {
      content: '';
      position: absolute; top: -4px; left: 50%;
      width: 7px; height: 7px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--gold);
      transform: translateX(-50%);
    }
    .crystal-gem {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed, #4c1d95);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      box-shadow: 0 0 24px rgba(167,139,250,.7), 0 0 4px rgba(167,139,250,1) inset;
      animation: gemPulse 2.5s ease-in-out infinite, orbit 8s linear infinite reverse;
      flex-shrink: 0;
    }
    @keyframes gemPulse {
      0%,100% { box-shadow: 0 0 20px rgba(167,139,250,.6), 0 0 4px rgba(167,139,250,1) inset; }
      50%      { box-shadow: 0 0 40px rgba(167,139,250,.9), 0 0 8px rgba(255,255,255,.6) inset; }
    }

    /* ── HEADER TEXT ── */
    .gate-header { text-align: center; margin-bottom: 36px; }

    .gate-eyebrow {
      font-family: 'Cinzel', serif;
      font-size: .62rem; letter-spacing: .3em;
      color: var(--gold); text-transform: uppercase;
      margin-bottom: 10px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .gate-eyebrow span { width: 28px; height: 1px; background: var(--gold2); }

    .gate-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.1rem, 4vw, 1.45rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: .04em;
      line-height: 1.2;
      text-shadow: 0 0 30px rgba(167,139,250,.4);
      margin-bottom: 8px;
    }
    .gate-subtitle {
      font-size: .95rem;
      font-style: italic;
      color: var(--muted);
    }

    /* ── DIVIDER ── */
    .gate-div {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 0 0 28px;
    }

    /* ── FORM ── */
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: .6rem; letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--crystal);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      stroke: var(--muted);
      stroke-width: 1.8;
      fill: none;
      pointer-events: none;
    }
    .form-group input {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: 'EB Garamond', serif;
      font-size: 1rem;
      padding: 11px 14px 11px 40px;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
      cursor: none;
    }
    .form-group input::placeholder { color: var(--muted); opacity: .6; }
    .form-group input:focus {
      border-color: var(--crystal);
      box-shadow: 0 0 0 3px rgba(167,139,250,.1);
    }

    /* shake anim on error */
    .shake { animation: shake .4s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)}
    }

    /* error border */
    .input-err { border-color: var(--danger) !important; box-shadow: 0 0 0 3px rgba(244,63,94,.1) !important; }

    /* ── SUBMIT BUTTON ── */
    .gate-btn {
      width: 100%;
      font-family: 'Cinzel', serif;
      font-size: .72rem; letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--void);
      background: linear-gradient(135deg, var(--gold) 0%, #e8a800 50%, var(--gold) 100%);
      background-size: 200% 100%;
      border: none; border-radius: 6px;
      padding: 14px;
      cursor: none;
      transition: background-position .4s, box-shadow .3s, transform .2s;
      box-shadow: 0 0 24px rgba(245,200,66,.25);
      margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .gate-btn:hover {
      background-position: right center;
      box-shadow: 0 0 40px rgba(245,200,66,.45);
      transform: translateY(-2px);
    }
    .gate-btn:active { transform: translateY(0); }

    /* Loading state */
    .gate-btn.loading .btn-text { opacity: 0; }
    .gate-btn.loading::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,.3);
      border-top-color: var(--void);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR MSG ── */
    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: rgba(244,63,94,.08);
      border: 1px solid rgba(244,63,94,.25);
      border-radius: 5px;
      font-family: 'Cinzel', serif;
      font-size: .62rem; letter-spacing: .12em;
      color: var(--danger); text-transform: uppercase;
      text-align: center;
    }

    /* ── SUCCESS OVERLAY ── */
    .success-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(4,5,13,.95);
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
    }
    .success-overlay.show { display: flex; animation: fadeIn .5s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .success-gem {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #c4b5fd, #7c3aed);
      clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
      box-shadow: 0 0 50px rgba(167,139,250,1);
      animation: gemPulse 1s ease-in-out infinite;
    }
    .success-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.1rem;
      color: var(--gold);
      letter-spacing: .08em;
      text-align: center;
    }
    .success-sub {
      font-family: 'Cinzel', serif;
      font-size: .68rem; letter-spacing: .25em;
      color: var(--crystal); text-transform: uppercase;
      text-align: center;
    }

    /* ── FOOTER ── */
    .gate-foot {
      text-align: center;
      margin-top: 20px;
      font-family: 'Cinzel', serif;
      font-size: .58rem; letter-spacing: .15em;
      color: var(--muted); text-transform: uppercase;
    }

    @keyframes rise {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>

  <!-- CURSOR -->
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <!-- BACKGROUND -->
  <canvas id="starfield"></canvas>
  <div class="bg-glow"></div>
  <div class="bg-mesh"></div>

  <!-- SUCCESS OVERLAY -->
  <div class="success-overlay" id="success-overlay">
    <div class="success-gem"></div>
    <div class="success-title">WELCOME. YOUR HIGHNESS.</div>
    <div class="success-sub">Membuka gerbang kristal…</div>
  </div>

  <!-- LOGIN CARD -->
  <div class="gate-wrap">
    <div class="gate-card">

      <!-- Crystal Icon -->
      <div class="crystal-wrap">
        <div class="crystal-outer">
          <div class="crystal-gem"></div>
        </div>
      </div>

      <!-- Header -->
      <div class="gate-header">
        <div class="gate-eyebrow">
          <span></span> Cosmic Gate <span></span>
        </div>
        <div class="gate-title">The Secret of Crystal</div>
        <p class="gate-subtitle">Masuki dunia yang tersembunyi…</p>
      </div>

      <div class="gate-div"></div>

      <!-- Form -->
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            id="username"
            placeholder="Masukkan username"
            autocomplete="off"
            onkeydown="if(event.key==='Enter')enterWorld()"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            type="password"
            id="password"
            placeholder="Masukkan password"
            onkeydown="if(event.key==='Enter')enterWorld()"
          />
        </div>
      </div>

      <button class="gate-btn" id="gate-btn" onclick="enterWorld()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        <span class="btn-text">Masuk ke Dunia Kristal</span>
      </button>

      <div class="error-msg" id="error-msg">
        ✕ &nbsp; Akses Ditolak — Identitas Tidak Dikenal
      </div>

      <div class="gate-foot">
        &copy; 2026 Aslam Universe &nbsp;·&nbsp; Gfx_Azdar23
      </div>

    </div>
  </div>

  <script>
    /* ── Cursor ── */
    const dot = document.getElementById('cur-dot');
    const ring = document.getElementById('cur-ring');
    let mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove', e => {
      mx=e.clientX; my=e.clientY;
      dot.style.left = mx-3+'px'; dot.style.top = my-3+'px';
    });
    (function loop(){
      rx+=(mx-rx-14)*.1; ry+=(my-ry-14)*.1;
      ring.style.left=rx+'px'; ring.style.top=ry+'px';
      requestAnimationFrame(loop);
    })();

    /* ── Starfield ── */
    const cv = document.getElementById('starfield');
    const cx = cv.getContext('2d');
    let W, H, stars = [];
    function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
    function initS(){
      stars = Array.from({length:200}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.1+.2,
        a: Math.random(),
        sp: Math.random()*.25+.04,
        tw: Math.random()*Math.PI*2,
        gold: Math.random() < .07
      }));
    }
    function drawS(){
      cx.clearRect(0,0,W,H);
      const t = Date.now()*.001;
      stars.forEach(s=>{
        const a = s.a*(.4+.6*Math.sin(t*s.sp+s.tw));
        cx.beginPath(); cx.arc(s.x,s.y,s.r,0,Math.PI*2);
        cx.fillStyle = s.gold
          ? `rgba(245,200,66,${a*.8})`
          : `rgba(226,224,240,${a})`;
        cx.fill();
      });
      requestAnimationFrame(drawS);
    }
    resize(); initS(); drawS();
    window.addEventListener('resize', ()=>{ resize(); initS(); });

    /* ── Login logic ── */
    function enterWorld() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn  = document.getElementById('gate-btn');
      const err  = document.getElementById('error-msg');
      const uInput = document.getElementById('username');
      const pInput = document.getElementById('password');

      // Reset error state
      err.style.display = 'none';
      uInput.classList.remove('input-err');
      pInput.classList.remove('input-err');

      if (user === 'AI' && pass === '2311') {
        // Success
        btn.classList.add('loading');
        setTimeout(() => {
          document.getElementById('success-overlay').classList.add('show');
          setTimeout(() => { window.location.href = 'azdar.html'; }, 1800);
        }, 700);
      } else {
        // Error
        err.style.display = 'block';
        uInput.classList.add('input-err');
        pInput.classList.add('input-err');
        document.querySelector('.gate-card').classList.add('shake');
        setTimeout(() => document.querySelector('.gate-card').classList.remove('shake'), 500);
        // clear password
        pInput.value = '';
        pInput.focus();
      }
    }
  </script>
</body>
</html>
