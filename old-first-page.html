<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Secret of Crystal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 20px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    .title {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 12px;
      margin-bottom: 25px;
      opacity: 0.7;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-size: 12px;
      opacity: 0.8;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 10px;
      outline: none;
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(99,102,241,0.6);
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      opacity: 0.6;
    }

    .crystal {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px;
      background: linear-gradient(135deg, #22d3ee, #a78bfa);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      box-shadow: 0 0 20px rgba(167,139,250,0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="crystal"></div>
    <div class="title">The Secret of Crystal</div>
    <div class="subtitle">Masuki dunia yang tersembunyi...</div>

    <div class="input-group">
      <label>Username</label>
      <input type="text" id= "username" placeholder="Masukkan username">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" id= "password" placeholder="Masukkan password">
    </div>

    <button class="btn" onclick="enterWorld()">Masuk</button>

    <div class="footer">© 2026 Aslam Universe</div>
  </div>

  <script>
  function enterWorld() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if (user === "AI" && pass === "2311") {
      alert("WELCOME. YOUR HIGHNESS");
      window.location.href = "Azdar.html";
    } else {
      alert("Access denied");
    }
  }
</script>
</body>
</html>
